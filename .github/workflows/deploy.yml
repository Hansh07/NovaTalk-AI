name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # 1. CI VALIDATION (Runs on push & PRs)
  # ==========================================
  test-and-lint:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci --legacy-peer-deps

      - name: Build Frontend
        working-directory: ./client
        run: npm run build

      - name: Check Server Syntax
        working-directory: ./server
        run: |
          npm ci
          node --check server.js

  # ==========================================
  # 2. DEPLOY FRONTEND TO VERCEL (On main push)
  # ==========================================
  deploy-frontend:
    name: Deploy to Vercel
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.VERCEL_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./client
          vercel-args: '--prod'

  # ==========================================
  # 3. DEPLOY BACKEND TO RENDER (On main push)
  # ==========================================
  deploy-backend:
    name: Trigger Render Deployment
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning ::RENDER_DEPLOY_HOOK_URL secret is not set. Skipping Render trigger."
            exit 0
          fi
          curl -s -S -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deployment triggered successfully!"
